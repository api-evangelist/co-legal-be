  media_type: application/json (JSON-RPC error object)
  observed: false
  source: 'https://co-legal.be/llms.txt — "over de limiet volgt 429 RATE_LIMIT_EXCEEDED met Retry-After"'
policies:
- name: Dynamic fair use
  description: payment-options.json declares rateLimitPolicy dynamic_fair_use for the free tier; the llms.txt says the current limit is on every response in the RateLimit-* and X-RateLimit-* headers, so clients should read the headers rather than hard-code 120/600.
- name: Hashed IP bucket key
  description: 'The bucket key is SHA-256(IP + per-process salt), not the raw address (https://co-legal.be/legal § Privacy — A2A-agent).'
