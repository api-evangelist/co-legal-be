    violations are expected to be rejected before execution.
problem_types:
- code: -32009
  reason: VERSION_NOT_SUPPORTED
  http_status: 200
  title: A2A protocol version not supported
  cause: The A2A-Version request header is missing (the server then assumes 0.3) or names a version other than 1.0.
  remediation: 'Send A2A-Version: 1.0 on every protocol request, as the provider''s llms.txt, agents.txt and payment-options.json (a2aRequiredHeaders) all state.'
  observed: true
- code: -32001
  reason: API_KEY_REQUIRED
  http_status: 401
  title: Extended AgentCard requires an API key
  cause: agent/getAuthenticatedExtendedCard (or GET /extendedAgentCard) called without a valid x-api-key.
  remediation: Request a key by email (ops@co-legal.be / contact@co-legal.be); there is no self-serve issuance. The public card at /.well-known/agent-card.json needs no key.
  observed: true
- code: -32000
  http_status: 405
  title: MCP server is POST-only
  cause: GET on https://agent.co-legal.be/mcp — the server offers no SSE stream.
  remediation: Use Streamable HTTP POST with Accept application/json, text/event-stream.
  observed: true
- reason: RATE_LIMIT_EXCEEDED
  http_status: 429
  title: Fair-use rate limit exceeded
  cause: Anonymous per-IP bucket exhausted (RateLimit-Limit 120 observed; 600 questions/hour/IP with a burst of 120 per the agent landing page).
  remediation: Honour Retry-After and the RateLimit-Reset / X-RateLimit-* headers; an optional x-api-key raises the quota.
  observed: false
  source: https://co-legal.be/llms.txt — "over de limiet volgt 429 RATE_LIMIT_EXCEEDED met Retry-After"
- http_status: 404
  title: Unknown path
  cause: Any path the agent host does not serve.
  remediation: Discovery paths are enumerated in /llms.txt and /agents.txt on the agent host; there is no /openapi.json, /docs or /api.
  observed: true
- http_status: 405
  title: Method not allowed on the JSON-RPC endpoint
  cause: GET on /a2a/jsonrpc.
  remediation: POST JSON-RPC 2.0 with Content-Type application/json.
  observed: true
task_states:
  note: >-
    A2A task lifecycle errors defined by the protocol (TaskNotFoundError -32001, TaskNotCancelableError
    -32002, PushNotificationNotSupportedError -32003, UnsupportedOperationError -32004, ContentTypeNotSupported
    -32005) were not exercised; tasks/list returned an empty list for the anonymous caller. Note the provider
