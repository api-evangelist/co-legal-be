discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: agent.co-legal.be
  note: >-
    The card is served from the dedicated agent host, not the apex. https://co-legal.be/.well-known/agent-card.json
    and /.well-known/agent.json both answer 302 to the same paths on agent.co-legal.be, so the apex delegates
    rather than 404s; www.co-legal.be 301s to the apex first. agent.co-legal.be returns a real 9-byte text/plain
    404 for unknown /.well-known/* paths and for a negative-control path that cannot exist
    (/.well-known/co-legal-be-negative-control-7f3ab91c.json), so the 200 is a served document and not a
    catch-all. Ownership is not in question: agent.co-legal.be is a subdomain of the company's registrable
    domain; the card's provider.organization is "Co-Legal B.V." with provider.url https://co-legal.be; the
    provider-metadata/v1 extension names KVK 42135345 (NL), the same registration the apex /legal and /contact
    pages carry; and the company's own /llms.txt names this exact URL as "AgentCard". The company is a Dutch
    B.V. (Delft) trading under a .be domain because its subject matter is Belgian law — a jurisdiction choice,
    not a domain mismatch.
  legacy_path_note: >-
    /.well-known/agent.json (the pre-0.3 path) ALSO answers 200 on agent.co-legal.be, but with a DIFFERENT
    document (25,028 vs 25,122 bytes): a 0.3-flavoured projection carrying top-level url, preferredTransport
    JSONRPC, flat OpenAPI-style securitySchemes ({type: apiKey, in: header, name: x-api-key}), a top-level
    security[] array, termsOfService and contactEmail, with per-skill `security` instead of
    `securityRequirements` — and its own ES256 signature. Saved verbatim as
    a2a/co-legal-be-agent-card-legacy.json. The provider serves both shapes on purpose, one per reader
    generation; the canonical 1.0-shaped card at agent-card.json is the graded document.
