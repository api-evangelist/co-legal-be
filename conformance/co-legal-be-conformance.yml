summary: >-
  Co-Legal's conformance profile is the agent-protocol stack plus the identifier standards of the European
  legal domain, rather than any enterprise API standard: an A2A 1.0 agent card signed with JWS ES256 (verified
  against a published RFC 7517 JWK Set), an MCP server negotiating protocol version 2025-06-18 whose twelve
  tools all carry MCP tool annotations, JSON-RPC 2.0 on both, JSON Schema 2020-12 parameter contracts, IETF
  RateLimit-* response headers observed live, RFC 6750 bearer as an optional quota credential, an RFC 9116
  security.txt, an AI Catalog 1.0 index and a Legal Context Protocol v1 pointer. It declares no OAuth 2.0 /
  OIDC, no RFC 9728 protected-resource metadata, no RFC 9457 problem details (errors are JSON-RPC objects with
  google.rpc.ErrorInfo data), no RFC 9727 API catalog and no OpenAPI. The domain-standard signature is strong
  and contract-level: the tool and skill schemas are keyed on ECLI, CELEX, KBO/BCE enterprise numbers, EU VIES
  VAT numbers, ISO 13616 IBANs and ISO 4217 currency codes.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  evidence: a2a/co-legal-be-agent-card.json — supportedInterfaces[0] {url https://agent.co-legal.be/a2a/jsonrpc, protocolBinding JSONRPC, protocolVersion "1.0"}, capabilities object, skills[] of 17, securitySchemes in 1.0 oneof form, signatures[]; POST tasks/list with A2A-Version 1.0 returned a real result and the server rejects requests without that header with -32009 VERSION_NOT_SUPPORTED. Graded conformant in a2a/co-legal-be-a2a.yml.
- id: a2a-agent-card-signature
  name: A2A AgentCard JWS signature (RFC 7515 JWS, ES256)
  conforms: true
  evidence: 'signatures[0].protected = {"alg":"ES256","kid":"colegal-agent-es256-1","jku":"https://agent.co-legal.be/.well-known/jwks.json","typ":"JOSE"}; verified 2026-09-19 against the P-256 key at the jku (well-known/co-legal-be-jwks.json). The legacy agent.json body carries its own valid-shape signature.'
- id: rfc7517-jwks
  name: JSON Web Key Set
  conforms: true
  evidence: https://agent.co-legal.be/.well-known/jwks.json — one EC/P-256/ES256 signing key, kid colegal-agent-es256-1.
- id: mcp
  name: Model Context Protocol
  version: '2025-06-18'
  conforms: true
  evidence: 'POST https://agent.co-legal.be/mcp initialize returned protocolVersion "2025-06-18", serverInfo {colegal-legal-lookup, 1.27.9}, capabilities for tools/prompts/resources; tools/list returned 12 tools each with inputSchema and annotations {readOnlyHint, destructiveHint, idempotentHint, openWorldHint}. See mcp/co-legal-be-mcp.yml.'
  note: The discovery pointer (/.well-known/mcp.json) and the card's discovery extension advertise protocolVersion 2025-11-25; the live server negotiated the client-offered 2025-06-18, which is the version-negotiation behaviour the spec prescribes.
- id: mcp-discovery-extension
  name: modelcontextprotocol.io discovery/v1 (A2A extension) + /.well-known/mcp.json pointer
  conforms: true
  evidence: a2a/co-legal-be-agent-card.json capabilities.extensions[] uri https://modelcontextprotocol.io/extensions/discovery/v1 with params {url, protocolVersion, discoveryUrl}; well-known/co-legal-be-mcp.json {name, version, protocolVersion, transports[streamable-http], alternatives.a2a, status available}.
- id: json-rpc-2.0
  conforms: true
  evidence: 'Both /mcp and /a2a/jsonrpc answer {"jsonrpc":"2.0", ...}; observed error objects -32000, -32001, -32009 with google.rpc.ErrorInfo in data[].'
