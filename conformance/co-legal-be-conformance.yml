domain_standards:
  note: >-
    0.12.0 domain_standard_conformance reads the CONTRACT. Co-Legal's contract is the MCP tools/list and the
    A2A card + tool-schema extension; every identifier below is declared as a typed, constrained input there,
    which is the difference between "mentions ECLI on a web page" and "accepts an ECLI as a schema-validated
    parameter". Each row cites the exact location.
  standards:
  - id: ecli
    name: European Case Law Identifier (Council conclusions 2011/C 127/01)
    conforms: true
    domain_standard_signature: true
    evidence: 'mcp/co-legal-be-mcp-tools.json tools ecli_lookup {ecli} and nl_rechtspraak_lookup {ecli}; a2a tool-schema/v1 params be.ecli.lookup.properties.ecli ("Shape: ECLI:BE:<court>:<year>:<serial>", minLength 15, maxLength 80) and nl.rechtspraak.lookup; skill legal.citation.verify accepts an ECLI.'
  - id: celex
    name: CELEX / EUR-Lex document identifier
    conforms: true
    domain_standard_signature: true
    evidence: 'mcp tool eurlex_lookup {celex, language}; a2a tool-schema/v1 eu.eurlex.lookup.properties.celex ("Shape: <sector><year><doctype><number>", examples 32016R0679, 62019CJ0311; a CELEX: prefix accepted) with a two-letter EUR-Lex language code defaulting to NL.'
  - id: kbo-bce-enterprise-number
    name: Belgian Crossroads Bank for Enterprises (KBO/BCE) enterprise number
    conforms: true
    domain_standard_signature: true
    evidence: 'mcp tool kbo_lookup {enterprise_number: string, minLength 10, maxLength 16, "10 digits (dots/spaces ok)"}; a2a skill be.kbo.lookup with the same schema.'
  - id: eu-vies-vat
    name: EU VAT Information Exchange System (VIES) VAT number validation
    conforms: true
    domain_standard_signature: true
    evidence: mcp tool vies_validate {vat} against the official EU VIES service; a2a skill be.vies.validate.
  - id: iso-13616-iban
    name: ISO 13616 IBAN (MOD-97 check digits)
    conforms: true
    domain_standard_signature: true
    evidence: mcp tool iban_validate — "ISO 13616 check digits via MOD-97 + country length"; a2a skill iban.validate tagged source:deterministic.
  - id: iso-4217
    name: ISO 4217 currency codes
    conforms: true
    domain_standard_signature: true
    evidence: >-
      mcp tool ecb_rates {currency: ISO 4217 code}; a2a skill ecb.rates. Rates sourced from the ECB eurofxref-daily feed.
  - id: justel-belgian-legislation-codes
    name: Belgian consolidated-legislation code abbreviations (BW, WVV, WIB92, VCF, WBTW, WBE, Sw, Ger.W) resolved to Justel
    conforms: true
    domain_standard_signature: true
    evidence: mcp tools legal_lookup {code, article} and legal_search; a2a skills be.legal.lookup and be.legal.search. Article-level Justel anchors on ejustice.just.fgov.be.
  - id: wetten-overheid-nl
    name: Dutch statute references (BW4, Successiewet 1956, Wet IB 2001, Wet OB 1968, BW6, Awb, Sr, Rv) resolved to wetten.overheid.nl
    conforms: true
    domain_standard_signature: true
    evidence: mcp tool nl_legal_lookup {code, article}; a2a skill nl.legal.lookup.
  - id: vcf-erfbelasting
    name: Flemish Tax Code (VCF art. 2.7.4.1.1) inheritance-tax brackets
    conforms: true
    domain_standard_signature: true
    evidence: mcp tool erfbelasting_tarieven — "parsed deterministically from the in-force Flemish Tax Code (VCF art. 2.7.4.1.1)"; a2a skill be.fiscal.erfbelasting tagged source:official-live and jurisdiction:BE-VLG.
compliance_program:
  certifications: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR certification is claimed anywhere on the site;
    /trust, trust.co-legal.be and security.co-legal.be do not exist. The published posture is a security and
