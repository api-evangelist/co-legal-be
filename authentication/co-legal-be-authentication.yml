  headline: >-
    Anonymous by design. Both agent surfaces — the A2A JSON-RPC endpoint and the MCP server — accept
    unauthenticated callers within a per-IP fair-use quota; the card declares this as a first-class option
    (securityRequirements[0] = {}). ONE optional credential exists, an API key, presentable either as the
    x-api-key header or as Authorization: Bearer <key> (RFC 6750). It raises the rate-limit quota and unlocks
    the extended agent card (paid skills); it is obtained by email, not self-serve, and the provider states keys
    are stored hashed. No OAuth 2.0, no OIDC, no discovery documents, no scopes. The card itself is
    authenticated the other way round — it is JWS-signed (ES256) and verifiable against a published JWKS.
schemes:
- name: anonymous
  type: none
  description: >-
    Declared explicitly — the A2A card's securityRequirements is [{}, {apiKeyAuth: []}, {httpBearer: []}] and
    the answer_legal_question skill's own securityRequirements starts with {}. Live probes confirmed: MCP
    initialize and tools/list, and A2A tasks/list, all succeeded with no credential, and the response carried
    X-RateLimit-Tier: anon.
  quota: RateLimit-Limit 120 (burst) observed; 600 questions per hour per IP per the agent landing page.
  sources: [a2a/co-legal-be-agent-card.json, 'POST https://agent.co-legal.be/mcp (2026-09-19)', 'POST https://agent.co-legal.be/a2a/jsonrpc (2026-09-19)']
