aid: co-legal-be
name: Co-Legal B.V.
description: >-
  Co-Legal B.V. is a Dutch company (KvK 42135345, Delft) building AI-native legal software and dossier
  support for Belgian and cross-border Belgium–Netherlands matters — wealth planning and succession, company
  law and transactions, tax and finance, real estate — sold to law firms, notaries, accountants and tax
  advisers by proposal, with the private platform behind Cloudflare Access and Microsoft Entra. Alongside it
  Co-Legal runs a public, free, anonymous, read-only agent at agent.co-legal.be for informational Belgian and
  Dutch legal and fiscal source questions: an A2A 1.0 agent card signed with JWS ES256 (verifiable against a
  published JWKS) declaring 17 skills — KBO/BCE company lookup, EU VIES VAT validation, Belgian and Dutch
  ECLI case-law resolvers, EUR-Lex/CELEX and Justel/wetten.overheid.nl statute resolvers, Flemish
  inheritance-tax brackets, ECB reference rates, IBAN validation, public legal-corpus search and read, a
  citation verifier, DOCX concept drafting and a natural-language answer skill — and a remote MCP server at
  https://agent.co-legal.be/mcp that answers an anonymous tools/list with 12 of those as read-only,
  idempotent tools. Everything runs on Google Cloud in the EU with the model (claude-opus-5 via Vertex AI)
  disclosed inside the card. No OpenAPI is published; the MCP tools/list and the card's tool-schema extension
  are the machine-readable contract.
