- aid: co-legal-be:co-legal-legal-lookup-mcp-server
  name: Co-Legal Legal Lookup MCP Server
  description: >-
    Remote Model Context Protocol server at https://agent.co-legal.be/mcp (Streamable HTTP, POST only,
    negotiated protocol version 2025-06-18, serverInfo colegal-legal-lookup 1.27.9). initialize and tools/list
    answer anonymously with twelve tools — kbo_lookup, vies_validate, ecli_lookup, eurlex_lookup,
    erfbelasting_tarieven, legal_lookup, legal_search, legal_read, nl_legal_lookup, nl_rechtspraak_lookup,
    iban_validate, ecb_rates — each carrying a real inputSchema and MCP annotations declaring it read-only,
    non-destructive and idempotent over official public sources (KBO/BCE, VIES, e-Justice/Juportal,
    EUR-Lex, Justel, wetten.overheid.nl, the Flemish Tax Code, the ECB). Discovered through
    /.well-known/mcp.json and the agent card's MCP discovery extension; no OAuth metadata, no session, no
    credential required.
  humanURL: https://co-legal.be/agent
  baseURL: https://agent.co-legal.be/mcp
