apis:
- aid: co-legal-be:co-legal-public-assistant-a2a-agent
  name: Co-Legal Public Assistant (A2A Agent)
  description: >-
    Agent2Agent 1.0 surface of Co-Legal's public legal/fiscal assistant. The agent card at
    https://agent.co-legal.be/.well-known/agent-card.json (version 1.27.9, JWS ES256-signed, verified against
    /.well-known/jwks.json) declares one JSONRPC interface at https://agent.co-legal.be/a2a/jsonrpc,
    streaming, an extended card, four extensions (per-skill JSON Schema 2020-12 input schemas,
    provider metadata with the KVK registration, model disclosure — claude-opus-5 via Google Cloud Vertex AI,
    EU — and an MCP discovery pointer) and 17 read-only skills covering Belgian and Dutch statute, case-law and
    company lookups, VAT and IBAN validation, Flemish inheritance-tax brackets, ECB rates, public
    legal-corpus search/read, citation verification, DOCX concept drafting and natural-language Q&A in Dutch,
    French or English. Anonymous within a per-IP fair-use quota advertised in RateLimit-* headers; the
    A2A-Version: 1.0 request header is mandatory. Informational only — not legal advice.
  humanURL: https://co-legal.be/agent
  baseURL: https://agent.co-legal.be/a2a/jsonrpc
