  mcp: 'none — POST-only Streamable HTTP; GET /mcp returns 405 "this MCP server offers no SSE stream"'
  push_notifications: not declared
multi_turn:
  a2a: 'message/send with the taskId of a previous task continues a conversation; task state lives in Cloud SQL (EU) with a 24 h idle TTL; no provider-side conversation store beyond that (https://co-legal.be/legal).'
  mcp: stateless; no session id
